name: Commits to Notion

on:
  push:
    branches: [develop]

jobs:
  notion:
    runs-on: ubuntu-latest
    steps:
      - name: Add commits to Notion DB
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: f7eaa18ed86e4fc2bf24db366565c7f4
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          set -euo pipefail
          while read -r c; do
            body=$(echo "$c" | jq --arg db "$NOTION_DB_ID" '{
              parent: { database_id: $db },
              properties: {
                "커밋 메시지": { title: [{ text: { content: (.message | split("\n")[0] | .[0:200]) } }] },
                "작성자": { rich_text: [{ text: { content: .author.name } }] },
                "커밋 날짜": { date: { start: .timestamp } },
                "SHA": { rich_text: [{ text: { content: .id[0:7] } }] },
                "커밋 링크": { url: .url },
                "브랜치": { select: { name: "develop" } }
              }
            }')
            curl -sS --fail-with-body -X POST https://api.notion.com/v1/pages \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Notion-Version: 2022-06-28" \
              -H "Content-Type: application/json" \
              -d "$body" > /dev/null
          done < <(echo "$COMMITS" | jq -c '.[]')